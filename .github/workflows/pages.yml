name: Validate and Deploy Nexoventia
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nexoventia-app
  cancel-in-progress: true
jobs:
  validate:
    name: Static and plan validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run syntax and product checks
        run: npm run check
      - name: Validate required assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s schema.sql
          test -s logo.svg
          test -s manifest.webmanifest
          test -s sw.js
  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: nexoventia-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: nexoventia-pages
